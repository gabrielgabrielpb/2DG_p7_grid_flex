<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: "Unbounded";
            src: url("fonts/unbounded.ttf");
        }
 
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        :root {
            --LIME: #CCFF02;
            --gris: #8696A8;
            --violet: #E4D2FC;
            --chilli: #EF432B;
            --dark: #282625;
            --perlacolor: #EFEAE8;
            --forest: #325444;
        }
 
        body {
            background: var(--dark);
            font-family: "Unbounded", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
 
        /* base */
        .container {
            display: grid;
            grid-template-columns: 520px 530px 360px;
            grid-template-rows: repeat(8, 100px);
        }
 
        /* propiedades de cada caja */
        .container div {
            padding: 12px 20px;
            overflow: hidden;
        }
 
        p {
            font-size: 16px;
        }
 
        h1 {
            font-weight: 400;
            line-height: 1;
        }
 
        /* columna izquierda */
        #LIME {
            grid-column: 1;
            grid-row: 1 / 3;
            background: var(--LIME);
            color: var(--forest);
        }
        #LIME h1 { font-size: 120px; }
 
        #gris {
            grid-column: 1;
            grid-row: 3 / 5;
            background: var(--gris);
            color: var(--perlacolor);
        }
        #gris h1 { font-size: 100px; }
 
        #VIOLET {
            grid-column: 1;
            grid-row: 5 / 7;
            background: var(--violet);
            color: var(--chilli);
        }
        #VIOLET h1 { font-size: 90px; }
 
        #CHILLI {
            grid-column: 1;
            grid-row: 7 / 9;
            background: var(--chilli);
            color: var(--perlacolor);
        }
        #CHILLI h1 { font-size: 80px; }
 
        /* columna central */
        #dark {
            grid-column: 2;
            grid-row: 1 / 4;
            background: var(--dark);
            color: var(--perlacolor);
        }
        #dark h1 { font-size: 120px; }
 
        #LIGHT-BRIGHT {
            grid-column: 2;
            grid-row: 4 / 9;
            background: var(--perlacolor);
            color: var(--dark);
        }
        #LIGHT-BRIGHT h1 {
            font-size: 85px;
            margin-top: 270px;    
        }

        /* columna dcha*/
        #FOREST {
            grid-column: 3;
            grid-row: 1 / 9;
            background: var(--forest);
            color: var(--perlacolor);
            display: flex;
            justify-content: space-between;
        }
        #FOREST h1 {
            font-size: 110px;
            writing-mode: vertical-rl;   /* text vertical*/
        }
    </style>
</head>

<body>
    <div class="container">
 
        <div id="LIME">
            <p>#CCFF02</p>
            <h1>LIME</h1>
        </div>
 
        <div id="gris">
            <p>#8696A8</p>
            <h1>STORM</h1>
        </div>
 
        <div id="VIOLET">
            <p>#E4D2FC</p>
            <h1>VIOLET</h1>
        </div>
 
        <div id="CHILLI">
            <p>#EF432B</p>
            <h1>CHILLI</h1>
        </div>
 
        <div id="dark">
            <p>#282625</p>
            <h1>DARK</h1>
        </div>
 
        <div id="LIGHT-BRIGHT">
            <p>#EFEAE8</p>
            <h1>LIGHT&BRIGHT</h1>
        </div>
 
        <div id="FOREST">
            <p>#325444</p>
            <h1>FOREST</h1>
        </div>
    </div>
</body>
</html>
